<!DOCTYPE html>
<html>
<head>
    <title>Smart Library Seat Booking</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', Tahoma;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height:100vh;
            padding:20px;
        }

        .container { max-width:1400px; margin:auto; }

        h1 { text-align:center; color:white; margin-bottom:10px; }
        .subtitle { text-align:center; color:#eee; margin-bottom:20px; }

        .stats {
            background: rgba(255,255,255,0.2);
            padding:15px;
            border-radius:10px;
            display:flex;
            justify-content:space-around;
            color:white;
            margin-bottom:20px;
        }

        .stat-number { font-size:28px; font-weight:bold; }

        .zones-container {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:20px;
        }

        .zone-card {
            background:white;
            border-radius:10px;
            padding:15px;
        }

        .zone-title {
            font-weight:bold;
            margin-bottom:10px;
            border-bottom:3px solid;
        }

        .zone-Silent { border-color:#3498db; }
        .zone-GroupStudy { border-color:#e74c3c; }
        .zone-ComputerLab { border-color:#2ecc71; }
        .zone-Reading { border-color:#f39c12; }

        .seats-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
            gap:8px;
        }

        .seat {
            aspect-ratio:1;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:11px;
            font-weight:bold;
            cursor:pointer;
        }

        .available { background:#2ecc71; color:white; }
        .booked { background:#e74c3c; color:white; }
        .occupied { background:#f39c12; color:white; }

        .booking-panel {
            background:white;
            padding:15px;
            border-radius:10px;
            margin-top:20px;
            text-align:center;
        }

        input { padding:8px; margin:5px; }

        button {
            padding:8px 15px;
            margin:5px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            background:#3498db;
            color:white;
        }

        .message {
            margin-top:10px;
            padding:10px;
            border-radius:6px;
            display:none;
        }

        .success { background:#d4edda; display:block; }
        .error { background:#f8d7da; display:block; }

        .legend {
            background:white;
            padding:10px;
            border-radius:10px;
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:20px;
        }

        .legend-item { display:flex; align-items:center; gap:10px; }
        .legend-color { width:20px; height:20px; border-radius:4px; }
    </style>
</head>

<body>
<div class="container">

<h1>Smart Library Seat Booking System</h1>
<p class="subtitle">Book your seat easily</p>

<div class="stats">
    <div><div class="stat-number" id="availableCount">0</div>Available</div>
    <div><div class="stat-number" id="bookedCount">0</div>Booked</div>
    <div><div class="stat-number" id="occupiedCount">0</div>Occupied</div>
</div>

<div class="zones-container" id="zonesContainer"></div>

<div class="booking-panel">
    <h3>Seat Actions</h3>
    <input id="studentName" placeholder="Enter name">
    <button onclick="bookSeat()">Book</button>
    <button onclick="checkIn()">Check-In</button>
    <button onclick="checkOut()">Check-Out</button>
    <div id="message" class="message"></div>
</div>

<div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:#2ecc71"></div>Available</div>
    <div class="legend-item"><div class="legend-color" style="background:#e74c3c"></div>Booked</div>
    <div class="legend-item"><div class="legend-color" style="background:#f39c12"></div>Occupied</div>
</div>

</div>

<script>
let seats = [];
let selectedSeat = null;
let bookingId = null;

// Load seats
async function loadSeats(){
    const res = await fetch('/api/seats');
    seats = await res.json();
    renderZones();
    updateStats();
}

// Render zones
function renderZones(){
    const zones=['Silent','Group Study','Computer Lab','Reading'];
    const container=document.getElementById('zonesContainer');
    container.innerHTML='';

    zones.forEach(zone=>{
        const zoneSeats=seats.filter(s=>s.zone===zone);

        const card=document.createElement('div');
        card.className='zone-card';

        card.innerHTML=`
            <div class="zone-title zone-${zone.replace(' ','')}">${zone}</div>
            <div class="seats-grid"></div>
        `;

        const grid=card.querySelector('.seats-grid');

        zoneSeats.forEach(seat=>{
            const status = (seat.status === 'released') ? 'available' : seat.status;

            const div=document.createElement('div');
            div.className=`seat ${status}`;
            div.innerText=seat.seat_number;

            div.onclick=()=>selectSeat(seat);

            grid.appendChild(div);
        });

        container.appendChild(card);
    });
}

// Select seat
function selectSeat(seat){
    selectedSeat = seat;
    bookingId = seat.booking_id || null;

    document.getElementById('studentName').value = '';

    showMessage(`Selected ${seat.seat_number} (${seat.status})`,"success");
}

// Book
async function bookSeat(){
    if(!selectedSeat) return showMessage("Select a seat","error");

    const name=document.getElementById('studentName').value;
    if(!name) return showMessage("Enter name","error");

    const res=await fetch('/api/book',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({seat_id:selectedSeat.id,student_name:name})
    });

    const data=await res.json();
    if(!res.ok) return showMessage(data.error,"error");

    bookingId = data.booking_id;

    showMessage("Seat booked! Check-in within 15 seconds","success");

    // Clear input after booking
    document.getElementById('studentName').value = '';

    loadSeats();
}

// Check-In
async function checkIn(){
    if(!bookingId) return showMessage("Select booked seat","error");

    await fetch('/api/checkin',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({booking_id:bookingId})
    });

    showMessage("Checked-in successfully","success");
    loadSeats();
}

// Check-Out
async function checkOut(){
    if(!bookingId) return showMessage("Select occupied seat","error");

    await fetch('/api/checkout',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({booking_id:bookingId})
    });

    showMessage("Checked-out successfully (Seat is now available)","success");

    bookingId = null;
    selectedSeat = null;

    // Clear input after checkout
    document.getElementById('studentName').value = '';

    loadSeats();
}

// Stats
function updateStats(){
    document.getElementById('availableCount').innerText =
        seats.filter(s=>s.status==='available' || s.status==='released').length;

    document.getElementById('bookedCount').innerText =
        seats.filter(s=>s.status==='booked').length;

    document.getElementById('occupiedCount').innerText =
        seats.filter(s=>s.status==='occupied').length;
}

// Message
function showMessage(msg,type){
    const div=document.getElementById('message');
    div.innerText=msg;
    div.className=`message ${type}`;
    setTimeout(()=>div.className='message',3000);
}

// Auto refresh
setInterval(loadSeats,3000);
loadSeats();
</script>

</body>
</html>
